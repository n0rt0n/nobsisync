name: Release

# Релиз собирается по пушу тега с версией: git tag 0.1.0 && git push origin 0.1.0
# BRAT ставит плагин именно из ассетов релиза, а не из файлов репозитория.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci

      # build прогоняет проверку типов и тесты — сломанный релиз не уедет
      - run: npm run build

      - name: Проверить, что тег совпадает с версией в manifest.json
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $MANIFEST_VERSION в manifest.json"
            exit 1
          fi

      - name: Создать релиз
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
